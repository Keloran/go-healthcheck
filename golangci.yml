version: "2"

run:
  concurrency: 4
  timeout: 2m
  issues-exit-code: 10
  tests: true

# deadcode/structcheck/varcheck folded into unused, gosimple/stylecheck into staticcheck
linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - nakedret
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gocyclo:
      min-complexity: 10
    govet:
      disable:
        - printf
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
